name: Playable Tic Tac Toe Engine

on:
  issues:
    types: [opened]

jobs:
  play:
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, 'ttt|')
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Process Game Move & Update Board
        run: |
          python3 - << 'EOF'
          import re, sys, random

          issue_title = "${{ github.event.issue.title }}"
          print(f"Processing issue title: {issue_title}")

          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()

          # Parse move: e.g. "ttt|move|1|3" or "ttt|reset"
          if 'reset' in issue_title:
              print("Resetting Tic-Tac-Toe Board...")
              # Reset board logic
              new_board = """| | Column 1 | Column 2 | Column 3 |
          | :---: | :---: | :---: | :---: |
          | **Row 1** | [<img src="https://img.shields.io/badge/-%F0%9F%92%AC_PLAY_(1%2C1)-00F5FF?style=for-the-badge" />](https://github.com/salilgupta17/salilgupta17/issues/new?title=ttt%7Cmove%7C1%7C1&body=Click+%27Submit+new+issue%27+to+make+this+move!) | [<img src="https://img.shields.io/badge/-%F0%9F%92%AC_PLAY_(1%2C2)-00F5FF?style=for-the-badge" />](https://github.com/salilgupta17/salilgupta17/issues/new?title=ttt%7Cmove%7C1%7C2&body=Click+%27Submit+new+issue%27+to+make+this+move!) | [<img src="https://img.shields.io/badge/-%F0%9F%92%AC_PLAY_(1%2C3)-00F5FF?style=for-the-badge" />](https://github.com/salilgupta17/salilgupta17/issues/new?title=ttt%7Cmove%7C1%7C3&body=Click+%27Submit+new+issue%27+to+make+this+move!) |
          | **Row 2** | [<img src="https://img.shields.io/badge/-%F0%9F%92%AC_PLAY_(2%2C1)-00F5FF?style=for-the-badge" />](https://github.com/salilgupta17/salilgupta17/issues/new?title=ttt%7Cmove%7C2%7C1&body=Click+%27Submit+new+issue%27+to+make+this+move!) | [<img src="https://img.shields.io/badge/-%F0%9F%92%AC_PLAY_(2%2C2)-00F5FF?style=for-the-badge" />](https://github.com/salilgupta17/salilgupta17/issues/new?title=ttt%7Cmove%7C2%7C2&body=Click+%27Submit+new+issue%27+to+make+this+move!) | [<img src="https://img.shields.io/badge/-%F0%9F%92%AC_PLAY_(2%2C3)-00F5FF?style=for-the-badge" />](https://github.com/salilgupta17/salilgupta17/issues/new?title=ttt%7Cmove%7C2%7C3&body=Click+%27Submit+new+issue%27+to+make+this+move!) |
          | **Row 3** | [<img src="https://img.shields.io/badge/-%F0%9F%92%AC_PLAY_(3%2C1)-00F5FF?style=for-the-badge" />](https://github.com/salilgupta17/salilgupta17/issues/new?title=ttt%7Cmove%7C3%7C1&body=Click+%27Submit+new+issue%27+to+make+this+move!) | [<img src="https://img.shields.io/badge/-%F0%9F%92%AC_PLAY_(3%2C2)-00F5FF?style=for-the-badge" />](https://github.com/salilgupta17/salilgupta17/issues/new?title=ttt%7Cmove%7C3%7C2&body=Click+%27Submit+new+issue%27+to+make+this+move!) | [<img src="https://img.shields.io/badge/-%F0%9F%92%AC_PLAY_(3%2C3)-00F5FF?style=for-the-badge" />](https://github.com/salilgupta17/salilgupta17/issues/new?title=ttt%7Cmove%7C3%7C3&body=Click+%27Submit+new+issue%27+to+make+this+move!) |"""
          
          # Replace game table block in README
          pattern = r"\| \| Column 1 \| Column 2 \| Column 3 \|[\s\S]*?\| \*\*Row 3\*\* \|.*\|"
          updated_content = re.sub(pattern, new_board, content)
          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(updated_content)
          EOF

      - name: Commit and Push Game Move
        run: |
          git config --global user.name "salil-game-bot"
          git config --global user.email "bot@github.com"
          git add README.md
          git commit -m "Update Tic-Tac-Toe game move from issue #${{ github.event.issue.number }}" || exit 0
          git push origin main

      - name: Close Game Issue
        uses: peter-evans/close-issue@v2
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: "🎮 **Move Accepted!** The Tic-Tac-Toe board on [salilgupta17's Profile](https://github.com/salilgupta17) has been updated!"
